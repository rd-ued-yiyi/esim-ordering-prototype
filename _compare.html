<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#222;font:12px sans-serif;display:flex;justify-content:center;gap:10px;padding:8px}
  .col{width:360px}
  .col h3{color:#fff;text-align:center;margin:2px 0 6px}
  .win{width:360px;height:640px;overflow:hidden;position:relative;background:#fff;border-radius:6px;transform-origin:top left}
  .win.fig img{position:absolute;top:-100px;left:0;width:360px}
  .win.mine iframe{position:absolute;top:-160px;left:-8px;width:376px;height:900px;border:0}
</style></head><body>
  <div class="col"><h3 style="color:#7cf">① Figma 原稿</h3><div class="win fig"><img src="_fig_dest.png?v=3"></div></div>
  <div class="col"><h3 style="color:#fc7">② 我的渲染</h3><div class="win mine"><iframe id="f" src="index.html?v=cmp3"></iframe></div></div>
<script>
  var f=document.getElementById('f');
  f.addEventListener('load',function(){
    var doc=f.contentDocument;
    setTimeout(function(){
      var e=doc.querySelector('[data-action="enter-esim"]'); if(e) e.click();
      setTimeout(function(){ var c=doc.querySelector('[data-dest="新加坡"]'); if(c) c.click(); },250);
    },250);
  });
</script>
</body></html>
